<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeData — Export</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 5v16M12 5C9 2 4 3 2 4v16c3-2 7-2 10 1 3-3 7-3 10-1V4c-2-1-7-2-10 1Z"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 5-5 8-9 10-4-2-9-5-9-10V6Z"/><path d="m8 11 3 3 5-6"/></symbol>
    <symbol id="tag" viewBox="0 0 24 24"><path d="M21 3H11L2 12l10 10 9-9Z"/><circle cx="16" cy="8" r="1"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7Zm-10 11 10 5 10-5M2 18l10 5 10-5"/></symbol>
    <symbol id="sliders" viewBox="0 0 24 24"><path d="M2 7h10m6 0h4M2 17h4m6 0h10"/><circle cx="15" cy="7" r="3"/><circle cx="9" cy="17" r="3"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M3 14v7h18v-7"/></symbol>
  </svg>
  <main class="export-panel">
    <form id="export-form">
      <section class="content-section" aria-labelledby="content-title">
        <header class="section-header">
          <span class="section-icon"><svg aria-hidden="true"><use href="#database"/></svg></span>
          <div><h1 id="content-title">1. Select content</h1><p>You must choose one content type.</p></div>
          <span class="required-badge">Required: select one content type</span>
        </header>
        <div class="content-options" role="radiogroup" aria-labelledby="content-title">
          <label class="content-card"><span class="card-icon"><svg aria-hidden="true"><use href="#book"/></svg></span><span>Business Data<br>Dictionary</span><input type="radio" name="content" value="dictionary" checked required></label>
          <label class="content-card"><span class="card-icon"><svg aria-hidden="true"><use href="#shield"/></svg></span><span>Data Quality<br>Rules</span><input type="radio" name="content" value="rules"></label>
          <label class="content-card"><span class="card-icon"><svg aria-hidden="true"><use href="#tag"/></svg></span><span>Data Labeling</span><input type="radio" name="content" value="labeling"></label>
          <label class="content-card"><span class="card-icon"><svg aria-hidden="true"><use href="#layers"/></svg></span><span>Data Quality<br>Issues Register</span><input type="radio" name="content" value="issues"></label>
        </div>
      </section>
      <section aria-labelledby="attributes-title">
        <header class="section-header attributes-header">
          <span class="section-icon"><svg aria-hidden="true"><use href="#sliders"/></svg></span>
          <div><h2 id="attributes-title">2. Select attributes and relations</h2><p>Choose the fields to include in your export.</p></div>
        </header>
        <div id="attributes" class="attributes-grid" role="group" aria-labelledby="attributes-title"></div>
        <p class="info-banner"><svg aria-hidden="true"><use href="#info"/></svg><span>The available attributes and relations change depending on the selected content type.</span></p>
      </section>
      <footer class="actions"><p id="export-status" role="status" aria-live="polite"></p><button class="reset-button" type="reset">Reset selection</button><button class="export-button" type="submit"><svg aria-hidden="true"><use href="#download"/></svg>Generate export</button></footer>
    </form>
    <noscript><p>Please enable JavaScript to configure your export.</p></noscript>
  </main>
</body>
</html>
