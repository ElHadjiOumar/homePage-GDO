<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervision & Consolidation Layer</title>
  <link rel="stylesheet" href="wedata.css?v=20261109-1" />
</head>

<body>
  <!-- Structure uniquement : les textes, cartes et liens viennent de wedata-data.js.
       Les id servent de reperes a wedata-ui.js ; les conserver lors d'un changement de texte. -->
  <main class="page">
    <section class="navigator-shell" aria-labelledby="navigatorTitle">
      <div class="navigator-header">
        <div>
          <div class="title-lockup">
            <img class="title-logo" src="../wedata-new-logo.png" alt="WeData" />
            <h1 id="navigatorTitle"></h1>
          </div>
          <p class="subtitle" id="navigatorSubtitle"></p>
          <p class="access-note" id="navigatorAccessNote"></p>
        </div>
      </div>

      <section class="panel" id="entityStep" aria-labelledby="entityTitle">
        <div class="panel-top">
          <div>
            <h2 class="panel-title" id="entityTitle"></h2>
            <p class="panel-help" id="entityHelp"></p>
          </div>
        </div>

        <div class="entity-groups" id="entityGroups"></div>

      </section>

      <section class="panel hidden" id="domainStep" aria-labelledby="domainTitle">
        <div class="panel-top">
          <div>
            <h2 class="panel-title" id="domainTitle"></h2>
            <p class="panel-help" id="domainHelp"></p>
          </div>
        </div>

        <div class="detail-stage">
          <div class="stage-label"><span class="stage-number">1</span><span id="entityStageLabel">Choose an entity</span></div>
          <div class="context-box">
          <div class="context-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M12 3 3 8l9 5 9-5-9-5Zm-5 8.1-4 2.22 9 5 9-5-4-2.22-5 2.78-5-2.78Zm0 5-4 2.22 9 5 9-5-4-2.22-5 2.78-5-2.78Z" />
            </svg>
          </div>
          <div>
            <p class="context-label" id="contextLabel"></p>
            <p class="context-value" id="selectedEntityLabel">-</p>
          </div>
          <button class="btn btn-secondary btn-change" id="changeEntityButton" type="button">Go back and change</button>
          </div>
        </div>

        <div class="detail-stage">
          <div class="stage-label"><span class="stage-number" id="destinationStageNumber">2</span><span id="destinationStageLabel">Choose content</span></div>
          <div class="card-grid domain-grid" id="domainGrid"></div>
        </div>
      </section>

      <!-- Zone reutilisee pour le message existant lorsqu'un lien est vide. -->
      <div class="feedback" id="feedback" role="status" hidden></div>
    </section>
  </main>

  <!-- Charger les donnees avant le comportement. Changer la version ?v= apres
       une publication pour eviter que le navigateur garde les anciens fichiers. -->
  <script src="wedata-data.js?v=20261109-1"></script>
  <script src="wedata-ui.js?v=20261109-1"></script>
  <script>
    initWeDataNavigator();
  </script>
</body>

</html>
